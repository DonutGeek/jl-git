<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JLGit</title>
    <script>
      // 首屏前同步昼夜，避免冷启动闪白
      (function () {
        var mode = "system";
        try {
          var raw = localStorage.getItem("jlgit-theme");
          if (raw) {
            var parsed = JSON.parse(raw);
            var saved = parsed && parsed.state && parsed.state.mode;
            if (saved === "light" || saved === "dark" || saved === "system") {
              mode = saved;
            }
          }
        } catch (e) {}
        var prefersDark =
          typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var dark = mode === "dark" || (mode === "system" && prefersDark);
        var root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.dataset.theme = mode;
        root.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <style>
      /* 优先用 boot 写入的 Token；无快照时按明暗回退，与 tokens 默认昼夜接近 */
      html,
      body {
        background: var(--background, #f5f5f5);
        color: var(--foreground, rgba(0, 0, 0, 0.88));
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }

      html.dark,
      html.dark body {
        background: var(--background, #000000);
        color: var(--foreground, rgba(255, 255, 255, 0.85));
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JLGit</title>
    <script>
      // 首屏前同步明暗 + 应用主题包快照，避免子窗/冷启动闪白或闪「原色」
      (function () {
        var mode = "system";
        try {
          var raw = localStorage.getItem("jlgit-theme");
          if (raw) {
            var parsed = JSON.parse(raw);
            var saved = parsed && parsed.state && parsed.state.mode;
            if (saved === "light" || saved === "dark" || saved === "system") {
              mode = saved;
            }
          }
        } catch (e) {}
        var prefersDark =
          typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var dark = mode === "dark" || (mode === "system" && prefersDark);
        var root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.dataset.theme = mode;
        root.style.colorScheme = dark ? "dark" : "light";

        try {
          var bootRaw = localStorage.getItem("jlgit-app-theme-boot");
          if (!bootRaw) {
            return;
          }
          var boot = JSON.parse(bootRaw);
          if (!boot || boot.dark !== dark) {
            return;
          }
          if (typeof boot.themeId === "string" && boot.themeId) {
            root.dataset.appTheme = boot.themeId;
          }
          root.dataset.sidebarTranslucent = boot.sidebarTranslucent
            ? "true"
            : "false";
          if (boot.contrast != null) {
            root.dataset.appThemeContrast = String(boot.contrast);
          }
          if (boot.native || !boot.vars) {
            return;
          }
          var vars = boot.vars;
          for (var key in vars) {
            if (Object.prototype.hasOwnProperty.call(vars, key) && vars[key]) {
              root.style.setProperty(key, vars[key]);
            }
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* 优先用 boot 写入的 Token；无快照时按明暗回退，与 tokens 默认昼夜接近 */
      html,
      body {
        background: var(--background, hsl(0 0% 100%));
        color: var(--foreground, hsl(0 0% 20%));
        margin: 0;
      }

      html.dark,
      html.dark body {
        background: var(--background, hsl(0 0% 7%));
        color: var(--foreground, hsl(0 0% 90%));
      }

      /* 极简启动壳：同色底 + 小转圈；无文案（避免未跟语言/主题的「正在启动」） */
      #app-loading {
        align-items: center;
        background: inherit;
        color: inherit;
        display: flex;
        inset: 0;
        justify-content: center;
        position: fixed;
      }

      #app-loading-spinner {
        animation: app-loading-spin 0.8s linear infinite;
        border: 2px solid
          color-mix(
            in srgb,
            var(--muted-foreground, var(--foreground, hsl(0 0% 45%))) 28%,
            transparent
          );
        border-radius: 9999px;
        border-top-color: var(
          --primary,
          var(--foreground, hsl(0 0% 35%))
        );
        height: 18px;
        width: 18px;
      }

      html.dark #app-loading-spinner {
        border-top-color: var(
          --primary,
          var(--foreground, hsl(0 0% 78%))
        );
      }

      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="app-loading" role="status" aria-label="Loading">
      <div id="app-loading-spinner" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

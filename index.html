<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JLGit</title>
    <script>
      // 首屏前同步主题，避免子窗口/冷启动闪白（与 jlgit-theme persist 对齐）
      (function () {
        var mode = "system";
        try {
          var raw = localStorage.getItem("jlgit-theme");
          if (raw) {
            var parsed = JSON.parse(raw);
            var saved = parsed && parsed.state && parsed.state.mode;
            if (saved === "light" || saved === "dark" || saved === "system") {
              mode = saved;
            }
          }
        } catch (e) {}
        var prefersDark =
          typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var dark = mode === "dark" || (mode === "system" && prefersDark);
        var root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.dataset.theme = mode;
        root.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <style>
      html,
      body {
        background: hsl(0 0% 100%);
        color: hsl(0 0% 20%);
        margin: 0;
      }

      html.dark,
      html.dark body {
        background: hsl(0 0% 7%);
        color: hsl(0 0% 90%);
      }

      #app-loading {
        align-items: center;
        background: inherit;
        color: inherit;
        display: flex;
        flex-direction: column;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        gap: 12px;
        inset: 0;
        justify-content: center;
        position: fixed;
      }

      #app-loading-spinner {
        animation: app-loading-spin 0.8s linear infinite;
        border: 2px solid hsl(0 0% 85%);
        border-radius: 9999px;
        border-top-color: hsl(0 0% 35%);
        height: 20px;
        width: 20px;
      }

      html.dark #app-loading-spinner {
        border-color: hsl(0 0% 28%);
        border-top-color: hsl(0 0% 78%);
      }

      @keyframes app-loading-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div id="app-loading" role="status" aria-label="Loading">
      <div id="app-loading-spinner" aria-hidden="true"></div>
      <span>JLGit 正在启动…</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

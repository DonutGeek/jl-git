# Keep dependency lifecycle scripts denied by default.
# esbuild is the only reviewed build script required by the current Vite toolchain.
allowBuilds:
  esbuild: true

# Delay newly published packages to reduce supply-chain exposure.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true
strictDepBuilds: true
engineStrict: true
nodeVersion: 22.22.1

# ESLint allows this patch release and it removes the obsolete rimraf/glob chain.
overrides:
  flat-cache: 4.0.1
  # mammoth 的 CLI 依赖仍锁定 argparse 1 → lodash 3；浏览器侧不调用 CLI，
  # 但生产依赖树仍必须使用已修复的 lodash。
  "argparse@1.0.3>lodash": 4.18.1

auditConfig:
  ignoreGhsas:
    - GHSA-qwww-vcr4-c8h2

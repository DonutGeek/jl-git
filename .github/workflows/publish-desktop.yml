name: Publish desktop apps

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            # WiX MSI 对中文 productName 易在 light.exe 因 code page 失败；Windows 用 NSIS
            args: "--bundles nsis"
          - name: macOS Apple Silicon
            platform: macos-latest
            # app：产出 .app.tar.gz(+.sig) 供线上升级；dmg：首次安装包
            args: "--target aarch64-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 按 tag（如 v1.0.2）自动写入 package.json / tauri.conf / Cargo.toml，避免手改三处
      - name: Sync version from tag
        run: node ./scripts/set-version.mjs "${{ github.ref_name }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # ① 发到公开仓（updater 匿名可读）
      # 需 Secrets：RELEASES_GITHUB_TOKEN（对 jl-git-releases 有 contents:write）
      - name: Build and publish to jl-git-releases
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
          GITHUB_TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN }}
          RUST_LOG: tauri_bundler=debug
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: DonutGeek
          repo: jl-git-releases
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: 鲸灵Git ${{ github.ref_name }}
          releaseBody: |
            鲸灵Git ${{ github.ref_name }}

            本仓托管安装包与线上升级清单（`latest.json`），可供匿名下载。
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # ② 同步同一 tag 的全部资产到源码仓 Release（构建只做一次）
      - name: Mirror release to source repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PUB_REPO: DonutGeek/jl-git-releases
          SRC_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          DIR="$(mktemp -d)"
          cleanup() { rm -rf "$DIR"; }
          trap cleanup EXIT

          gh release download "$TAG" --repo "$PUB_REPO" --dir "$DIR" --clobber

          if ! gh release view "$TAG" --repo "$SRC_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$SRC_REPO" \
              --title "鲸灵Git $TAG" \
              --notes "鲸灵Git $TAG"$'\n\n'"与公开仓 DonutGeek/jl-git-releases 同步的安装包。" \
              --verify-tag
          fi

          shopt -s nullglob
          files=("$DIR"/*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No assets to mirror"
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}" --repo "$SRC_REPO" --clobber
